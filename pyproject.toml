[project]
name = "graphiti-api-service"
version = "1.0.0"
description = "Zep-Compatible Graphiti API service with FalkorDB backend"
authors = [{name = "Zep AI", email = "support@getzep.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

dependencies = [
    # FastAPI and web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "python-multipart>=0.0.6",
    
    # Database and Redis
    "redis>=5.0.0",
    "falkordb>=1.1.2",
    "neo4j>=5.26.0",
    "diskcache>=5.6.3",
    
    # AI and ML
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
    "voyageai>=0.2.0",
    
    # Data processing
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    
    # HTTP and networking
    "httpx>=0.25.0",
    "aiohttp>=3.8.0",
    "requests>=2.31.0",
    
    # Performance and async
    "tenacity>=8.2.0",
    "asyncio-throttle>=1.0.2",
    "async-timeout>=4.0.0",
    
    # Configuration and environment
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    
    # Utilities
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "uuid>=1.30",
    "posthog>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
ignore = ["E501", "N806", "N803"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true